<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us – RandomWheel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <style>
    .contact-container { padding: 140px 0 80px; max-width: 600px; margin: 0 auto; }
    .contact-details { 
      background: var(--surface); 
      padding: 40px; 
      border-radius: var(--radius); 
      border: 1px solid var(--border); 
      text-align: center;
    }
    .info-card {
      margin: 25px 0;
      padding: 15px;
      background: var(--bg2);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .info-label {
      display: block;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 5px;
    }
    .info-value {
      font-size: 1.25rem;
      color: var(--text);
      font-weight: 600;
    }
    .info-value a {
      color: var(--text);
      text-decoration: none;
      transition: color 0.3s;
    }
    .info-value a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

<div id="header-root"></div>

<main class="container">
  <div class="contact-container">
    <h1 style="font-family: var(--font-display); color: var(--text); margin-bottom: 10px; text-align: center;">Get in Touch</h1>
    <p style="color: var(--text2); text-align: center; margin-bottom: 40px;">Have a feature request or found a bug? Let us know!</p>
    
    <div class="contact-details">
      <div class="info-card">
        <span class="info-label">Founder</span>
        <div class="info-value">Mubeen</div>
      </div>
      
      <div class="info-card">
        <span class="info-label">Email Us</span>
        <div class="info-value">
          <a href="mailto:mubeenahmedzex@gmail.com">mubeenahmedzex@gmail.com</a>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="footer-root"></div>

<script src="components/header.js"></script>
<script src="components/footer.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('header-root').innerHTML = Header.render();
    Header.init();
    document.getElementById('footer-root').innerHTML = Footer.render();
    Footer.init();
  });
</script>
</body>
</html>
